<!DOCTYPE html>
<html lang="vi" data-mm-page="category">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Mục - MultiMart KOREA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/seo.js"></script>
</head>
<body class="pb-24 md:pb-0">
<div data-mm="header"></div>

<main class="max-w-7xl mx-auto px-4 pt-4 pb-10">
  <div class="flex gap-4">
    <!-- Sidebar -->
    <aside class="w-24 md:w-64 shrink-0 space-y-2 sticky top-32 self-start">
      <div id="cat-list" class="space-y-2"></div>
    </aside>

    <!-- Right -->
    <section class="flex-1 space-y-6">
      <!-- Banner -->
      <div id="cat-banner" class="w-full h-32 md:h-44 rounded-[28px] overflow-hidden relative"></div>

      <!-- Toolbar -->
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div id="cat-chips" class="flex gap-2 overflow-x-auto hide-scrollbar"></div>
        <div class="flex items-center gap-2">
          <select id="sort" class="field !py-2 text-xs">
            <option value="default">Mặc định</option>
            <option value="low">Giá thấp → cao</option>
            <option value="high">Giá cao → thấp</option>
            <option value="rating">Đánh giá tốt</option>
            <option value="sold">Bán chạy</option>
          </select>
        </div>
      </div>

      <!-- Grid -->
      <div id="prod-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
      <div id="empty" class="hidden text-center py-20 text-slate-400">
        <i class="fas fa-box-open text-5xl mb-3"></i><p>Chưa có sản phẩm nào trong danh mục này.</p>
      </div>
    </section>
  </div>
</main>

<div data-mm="footer"></div>
<div data-mm="bottomnav" data-active="cat"></div>

<script src="assets/data/products.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/pages/category.js"></script>
<script src="assets/js/enhancements.js"></script>
</body>
</html>
