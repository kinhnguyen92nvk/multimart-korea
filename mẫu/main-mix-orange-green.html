<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiMart Mix: Cam x Green - Chợ Việt tại Hàn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    :root {
      --brand:    #d97706; /* Màu cam gốc cho Header */
      --brand-dk: #b45309;
      --secondary: #16a34a; /* Màu xanh lá cho điểm nhấn/Sale */
      --secondary-dk: #15803d;
    }
    .app-header { background: var(--brand) !important; }
    .header-shortcuts { background: var(--brand-dk) !important; }
    
    /* Màu xanh lá cho các nút hành động hoặc chip */
    .btn-green { background: var(--secondary); color: white; border-radius: 6px; padding: 4px 12px; font-weight: bold; }
    .text-green-brand { color: var(--secondary) !important; }
    .bg-green-brand { background: var(--secondary) !important; }
    
    .bottom-nav a.active { color: var(--brand) !important; }
    .bottom-nav .fab { background: var(--secondary) !important; } /* Nút Đăng tin màu xanh lá */
  </style>
</head>
<body class="pb-16 md:pb-0">

<div class="app-header text-white p-3 flex justify-between items-center sticky top-0 z-50">
  <div class="flex items-center gap-2">
    <div class="w-8 h-8 bg-white text-amber-600 rounded-lg flex items-center justify-center font-bold">M</div>
    <span class="font-bold">MultiMart <span class="text-green-300">Mix</span></span>
  </div>
  <div class="flex-1 mx-3"><input type="text" placeholder="Tìm cá tươi, điện thoại..." class="w-full h-8 rounded-full px-4 text-black text-xs border-none"></div>
  <i class="fas fa-shopping-cart"></i>
</div>

<div class="header-shortcuts text-white flex gap-2 p-2 overflow-x-auto text-[10px] font-bold">
  <span class="bg-white/20 px-3 py-1 rounded-full flex-shrink-0">BẢNG GIÁ ĐIỆN THOẠI</span>
  <span class="bg-white/20 px-3 py-1 rounded-full flex-shrink-0">KHUYẾN MÃI HOT</span>
  <span class="bg-white/20 px-3 py-1 rounded-full flex-shrink-0">SIM 4G/5G</span>
</div>

<div class="max-w-7xl mx-auto p-2">
  <!-- Hero kết hợp 2 màu -->
  <section class="block-white overflow-hidden rounded-xl border border-gray-100 mb-3 font-['Lexend']">
    <div class="flex">
      <div class="w-2/3 relative h-40">
        <img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=600" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-r from-black/60 translate-x-0 p-4 flex flex-col justify-center">
          <span class="bg-amber-500 text-white text-[9px] px-2 py-0.5 rounded w-fit mb-1 font-bold">MỚI VỀ</span>
          <h2 class="text-white font-bold leading-tight">Thực phẩm tươi sạch<br>Giao từ Seoul 2h</h2>
        </div>
      </div>
      <div class="w-1/3 flex flex-col gap-1 p-1">
        <div class="flex-1 bg-green-600 rounded-lg flex flex-col items-center justify-center text-white text-[10px] font-bold">
          <i class="fas fa-leaf text-lg mb-1"></i> RAU CỦ
        </div>
        <div class="flex-1 bg-amber-600 rounded-lg flex flex-col items-center justify-center text-white text-[10px] font-bold">
          <i class="fas fa-mobile-alt text-lg mb-1"></i> IPHONE
        </div>
      </div>
    </div>
  </section>

  <!-- Flash Sale dùng xanh lá làm điểm nhấn -->
  <section class="block-white p-3 rounded-xl border mb-3">
    <div class="flex justify-between items-center mb-3">
      <h2 class="font-bold flex items-center gap-2">
        <span class="bg-green-600 text-white p-1 rounded text-[10px]"><i class="fas fa-bolt"></i></span>
        FLASH SALE HÔM NAY
      </h2>
      <span class="text-green-600 text-xs font-bold">Xem thêm</span>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div class="border rounded-lg p-2 relative">
        <div class="bg-red-500 text-white absolute top-0 left-0 px-2 py-0.5 text-[9px] rounded-br-lg font-bold">-25%</div>
        <div class="h-24 bg-gray-100 rounded-md mb-2"></div>
        <p class="text-[11px] font-medium h-8 overflow-hidden">Kim chi cải thảo chuẩn vị Việt 5kg</p>
        <p class="text-green-600 font-bold">25.000₩ <small class="text-gray-400 line-through font-normal text-[9px]">35.000₩</small></p>
      </div>
      <div class="border rounded-lg p-2">
        <div class="h-24 bg-gray-100 rounded-md mb-2"></div>
        <p class="text-[11px] font-medium h-8 overflow-hidden">iPhone 15 Pro Max 256GB Gold</p>
        <p class="text-amber-600 font-bold">1.450.000₩</p>
      </div>
    </div>
  </section>
</div>

<div class="bottom-nav fixed bottom-0 left-0 right-0 h-14 bg-white border-t flex items-center justify-around z-50">
  <div class="flex flex-col items-center text-amber-600"><i class="fas fa-home"></i><span class="text-[9px] font-bold">Trang chủ</span></div>
  <div class="flex flex-col items-center text-gray-400"><i class="fas fa-th-large"></i><span class="text-[9px]">Danh mục</span></div>
  <div class="relative -top-3">
    <div class="w-12 h-12 bg-green-600 rounded-full shadow-lg flex items-center justify-center text-white text-xl border-4 border-white"><i class="fas fa-plus"></i></div>
  </div>
  <div class="flex flex-col items-center text-gray-400"><i class="fas fa-tags"></i><span class="text-[9px]">Bảng giá</span></div>
  <div class="flex flex-col items-center text-gray-400"><i class="fas fa-user"></i><span class="text-[9px]">Tôi</span></div>
</div>

</body>
</html>
