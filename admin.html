<!DOCTYPE html>
<html lang="vi" data-mm-page="admin">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - MultiMart KOREA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/seo.js"></script>
  <style>
    .side-link.active { background: linear-gradient(135deg,#6366f1,#a855f7); color:#fff; }
    .side-link.active i { color: #fff; }
  </style>
</head>
<body>

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-white p-5 hidden md:flex flex-col">
    <a href="index.html" class="flex items-center gap-2 mb-10 no-underline">
      <div class="w-10 h-10 gradient-brand rounded-xl flex items-center justify-center font-bold">M</div>
      <div>
        <div class="font-extrabold text-white">MultiMart</div>
        <div class="text-[10px] text-indigo-400 uppercase tracking-widest">Admin Panel</div>
      </div>
    </a>
    <nav class="space-y-1 flex-1">
      <a href="#" data-tab="dashboard" class="side-link active flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold no-underline text-slate-300"><i class="fas fa-tachometer-alt w-5 text-indigo-400"></i> Tổng quan</a>
      <a href="#" data-tab="products"  class="side-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold no-underline text-slate-300 hover:bg-slate-800"><i class="fas fa-box w-5 text-indigo-400"></i> Sản phẩm</a>
      <a href="#" data-tab="orders"    class="side-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold no-underline text-slate-300 hover:bg-slate-800"><i class="fas fa-shopping-cart w-5 text-indigo-400"></i> Đơn hàng</a>
      <a href="#" data-tab="phones"    class="side-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold no-underline text-slate-300 hover:bg-slate-800"><i class="fas fa-mobile-alt w-5 text-indigo-400"></i> Bảng giá ĐT</a>
      <a href="#" data-tab="banners"   class="side-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold no-underline text-slate-300 hover:bg-slate-800"><i class="fas fa-image w-5 text-indigo-400"></i> Banner & KM</a>
      <a href="#" data-tab="customers" class="side-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold no-underline text-slate-300 hover:bg-slate-800"><i class="fas fa-users w-5 text-indigo-400"></i> Khách hàng</a>
      <a href="admin-cms.html" class="side-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold no-underline text-slate-300 hover:bg-slate-800" style="background:linear-gradient(135deg,rgba(22,163,74,.18),rgba(245,158,11,.18))"><i class="fas fa-robot w-5 text-green-400"></i> CMS AI <span class="ml-auto text-[9px] bg-amber-500 text-slate-900 px-1.5 py-0.5 rounded font-black">NEW</span></a>
      <a href="#" data-tab="settings"  class="side-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold no-underline text-slate-300 hover:bg-slate-800"><i class="fas fa-cog w-5 text-indigo-400"></i> Cấu hình</a>
    </nav>
    <a href="profile.html" class="bg-slate-800 rounded-xl p-3 flex items-center gap-3 no-underline mt-4">
      <img src="https://ui-avatars.com/api/?name=Admin&background=a855f7&color=fff" class="w-10 h-10 rounded-lg">
      <div class="flex-1 text-xs"><div class="font-bold text-white">Admin Duy</div><div class="text-slate-500">Quản trị viên</div></div>
      <i class="fas fa-sign-out-alt text-slate-500"></i>
    </a>
  </aside>

  <!-- Main -->
  <main class="flex-1 bg-slate-50 overflow-x-hidden">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
      <h1 id="page-title" class="font-black text-xl">Tổng quan</h1>
      <div class="flex items-center gap-3">
        <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center relative"><i class="fas fa-bell"></i><span class="badge-dot">3</span></button>
        <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center"><i class="fas fa-envelope"></i></button>
        <a href="index.html" class="btn btn-ghost text-xs no-underline"><i class="fas fa-eye"></i> Xem site</a>
      </div>
    </header>

    <div id="content" class="p-6"></div>
  </main>
</div>

<script src="assets/data/phones-images.js"></script>
<script src="assets/data/products.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/pages/admin.js"></script>
<script src="assets/js/enhancements.js"></script>

</html>
