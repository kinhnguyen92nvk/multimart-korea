<!DOCTYPE html>
<html lang="vi" data-mm-page="phone-spec">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cấu hình & Giá - MultiMart Korea</title>
  <meta name="description" id="meta-desc" content="Bảng giá điện thoại tại Hàn Quốc - MultiMart Korea">
  <meta property="og:type" content="product">
  <meta property="og:title" id="og-title" content="MultiMart Korea">
  <meta property="og:description" id="og-desc" content="">
  <meta property="og:image" id="og-image" content="">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: system-ui,-apple-system,'Segoe UI',sans-serif; background:#f8fafc; color:#0f172a; padding-bottom: 90px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .crumb { font-size:12px; color:#64748b; padding:8px 16px; }
    .crumb a { color:#16a34a; text-decoration:none; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; }
    .card-pad { padding:18px; }
    .hero { display:grid; grid-template-columns: 1fr; gap:18px; }
    @media (min-width: 768px) { .hero { grid-template-columns: 460px 1fr; } }
    .hero-img-wrap { background: linear-gradient(135deg,#fff,#f1f5f9); border:1px solid #e2e8f0; border-radius:16px; aspect-ratio: 1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
    .hero-img-wrap img { max-width:88%; max-height:88%; object-fit:contain; transition:opacity .25s; }
    .hero-img-wrap .brand-tag { position:absolute; top:14px; left:14px; background:#0f172a; color:#fff; padding:4px 10px; border-radius:8px; font-size:11px; font-weight:800; letter-spacing:.04em; }
    .thumb-strip { display:flex; gap:8px; margin-top:10px; overflow-x:auto; padding-bottom:4px; }
    .thumb { width:64px; height:64px; flex-shrink:0; border:2px solid #e2e8f0; border-radius:10px; overflow:hidden; cursor:pointer; background:#fff; transition:all .15s; }
    .thumb img { width:100%; height:100%; object-fit:contain; padding:4px; }
    .thumb:hover { border-color:#94a3b8; }
    .thumb.active { border-color:#16a34a; box-shadow:0 4px 10px -4px rgba(22,163,74,.5); }
    .pill-grid { display:flex; flex-wrap:wrap; gap:8px; }
    .pill { border:2px solid #e2e8f0; background:#fff; padding:10px 14px; border-radius:12px; cursor:pointer; font-weight:700; font-size:13px; color:#334155; transition:all .15s; text-align:left; min-width:90px; }
    .pill .config-name { display:block; font-weight:800; }
    .pill .config-price { display:block; font-size:11px; color:#16a34a; font-weight:800; margin-top:2px; }
    .pill:hover { border-color:#16a34a; }
    .pill.active { border-color:#16a34a; background:#dcfce7; color:#14532d; box-shadow:0 4px 12px -4px rgba(22,163,74,.4); }
    .swatch-grid { display:flex; flex-wrap:wrap; gap:10px; }
    .swatch { display:flex; align-items:center; gap:8px; padding:6px 10px 6px 6px; border:2px solid #e2e8f0; border-radius:999px; cursor:pointer; font-size:12px; font-weight:700; transition:all .15s; }
    .swatch:hover { border-color:#16a34a; }
    .swatch.active { border-color:#16a34a; background:#f0fdf4; }
    .swatch-dot { width:24px; height:24px; border-radius:50%; border:2px solid rgba(0,0,0,.1); flex-shrink:0; }
    .price-box { background: linear-gradient(135deg,#fff7ed,#fef3c7); border:1px solid #fbbf24; border-radius:14px; padding:16px; }
    .price-main { font-size:30px; font-weight:900; color:#dc2626; line-height:1; }
    .promo { background:#fef2f2; border:1px solid #fecaca; border-radius:12px; padding:14px; margin-top:14px; }
    .promo h4 { color:#dc2626; font-weight:900; font-size:13px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
    .promo-list { font-size:12px; color:#7f1d1d; }
    .promo-list li { padding:4px 0; display:flex; gap:6px; }
    .promo-list li::before { content:'✓'; color:#16a34a; font-weight:900; }
    .trust-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
    .trust-item { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:10px 6px; text-align:center; }
    .trust-item i { font-size:20px; color:#16a34a; }
    .trust-item .lbl { font-size:11px; font-weight:700; color:#166534; margin-top:4px; line-height:1.2; }
    .btn-buy { display:flex; align-items:center; justify-content:center; gap:8px; padding:14px 20px; border-radius:12px; font-weight:900; font-size:15px; border:none; cursor:pointer; transition:all .15s; text-decoration:none; }
    .btn-buy.primary { background:linear-gradient(135deg,#16a34a,#059669); color:#fff; box-shadow:0 6px 16px -6px rgba(22,163,74,.6); }
    .btn-buy.primary:hover { transform:translateY(-2px); }
    .btn-buy.secondary { background:#fff; border:2px solid #16a34a; color:#15803d; }
    .tabs { display:flex; gap:4px; border-bottom:1px solid #e2e8f0; padding:0 4px; overflow-x:auto; }
    .tab { padding:10px 16px; font-weight:700; font-size:13px; cursor:pointer; color:#64748b; border-bottom:3px solid transparent; transition:all .15s; white-space:nowrap; }
    .tab.active { color:#16a34a; border-color:#16a34a; }
    .spec-table { width:100%; }
    .spec-table tr { border-bottom:1px solid #f1f5f9; }
    .spec-table td { padding:10px 14px; font-size:13px; vertical-align:top; }
    .spec-table td:first-child { color:#64748b; font-weight:700; width:36%; background:#fafbfc; }
    .related-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    @media (min-width:768px) { .related-grid { grid-template-columns:repeat(4,1fr); } }
    .rel-card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; text-decoration:none; color:inherit; transition:all .15s; display:block; }
    .rel-card:hover { transform:translateY(-3px); border-color:#16a34a; }
    .rel-card img { aspect-ratio:1; width:100%; object-fit:contain; padding:12px; background:linear-gradient(135deg,#fff,#f1f5f9); }
    .rel-card .info { padding:10px 12px; }
    .rel-card .name { font-size:13px; font-weight:800; color:#0f172a; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.4em; }
    .rel-card .pr { color:#dc2626; font-weight:900; font-size:14px; margin-top:4px; }
    .sticky-buy { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #e2e8f0; box-shadow:0 -4px 20px -4px rgba(0,0,0,.1); padding:10px 14px; z-index:100; display:flex; align-items:center; gap:10px; }
    .sticky-buy img { width:50px; height:50px; object-fit:contain; border-radius:8px; background:#f1f5f9; flex-shrink:0; }
    .sticky-buy .info-mini { flex:1; min-width:0; }
    .sticky-buy .name-mini { font-size:13px; font-weight:800; color:#0f172a; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sticky-buy .price-mini { color:#dc2626; font-weight:900; font-size:15px; }
    .sticky-buy .btn-mini { padding:10px 14px; border-radius:10px; font-weight:800; font-size:12px; border:none; cursor:pointer; text-decoration:none; display:flex; align-items:center; gap:4px; }
    .sticky-buy .btn-mini.zalo { background:#0068ff; color:#fff; }
    .sticky-buy .btn-mini.kakao { background:#fee500; color:#3c1e1e; }
    @media (max-width: 480px) { .trust-row { grid-template-columns:repeat(2,1fr); } }
    .top-bar { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.95); backdrop-filter:blur(8px); border-bottom:1px solid #e2e8f0; padding:10px 16px; display:flex; align-items:center; gap:12px; }
    .top-bar .logo { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#16a34a,#22c55e); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; }
    .badge-stock { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:800; }
    .badge-stock.in { background:#dcfce7; color:#15803d; }
    .badge-stock.out { background:#fef3c7; color:#92400e; }
    .stars { color:#fbbf24; }
    .skel { background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%); background-size:200% 100%; animation:skel 1.5s infinite; border-radius:8px; }
    @keyframes skel { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body>

<header class="top-bar">
  <a href="index.html" class="flex items-center gap-2 no-underline shrink-0">
    <div class="logo">M</div>
    <div>
      <div class="font-extrabold text-sm leading-tight text-slate-900">MultiMart</div>
      <div class="text-green-600 text-[10px] font-bold leading-tight">KOREA</div>
    </div>
  </a>
  <div class="flex-1 truncate text-sm font-bold" id="bar-title">Đang tải...</div>
  <a href="price-board.html" class="text-xs text-slate-500 font-bold hover:text-slate-900 no-underline"><i class="fas fa-table"></i> Bảng giá</a>
</header>

<div class="crumb container">
  <a href="index.html">Trang chủ</a> ›
  <a href="price-board.html">Bảng giá</a> ›
  <span id="crumb-model">...</span>
</div>

<main class="container px-3 md:px-4 space-y-4" id="content">
  <div class="card card-pad">
    <div class="skel h-8 w-2/3 mb-3"></div>
    <div class="skel h-4 w-1/2 mb-2"></div>
  </div>
</main>

<div id="error" class="hidden container card card-pad m-4">
  <div class="text-red-600 font-bold">❌ Không tìm thấy model.</div>
  <a href="price-board.html" class="text-green-600 text-sm font-bold">← Quay lại bảng giá</a>
</div>

<div class="sticky-buy" id="sticky-buy" style="display:none">
  <img id="sb-img" src="" alt="">
  <div class="info-mini">
    <div class="name-mini" id="sb-name"></div>
    <div class="price-mini"><span id="sb-price">—</span> ₩</div>
  </div>
  <div style="display:flex;gap:6px">
    <a href="https://pf.kakao.com/" target="_blank" class="btn-mini kakao"><i class="fas fa-comment"></i> Kakao</a>
    <a href="https://zalo.me/" target="_blank" class="btn-mini zalo"><i class="fas fa-bolt"></i> Đặt</a>
  </div>
</div>

<script src="assets/data/phones-images.js"></script>
<script src="assets/data/products.js"></script>
<script src="assets/data/phones-catalog.js"></script>
<script src="assets/js/utils.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const slug = params.get('model');
  const $ = id => document.getElementById(id);
  if (!slug) { $('content').style.display='none'; $('error').classList.remove('hidden'); return; }

  let catKey = slug;
  let cat = window.MM_CATALOG?.[slug];
  if (!cat && window.MM_CATALOG_FIND) {
    const k = window.MM_CATALOG_FIND(slug);
    if (k) { cat = window.MM_CATALOG[k]; catKey = k; }
  }
  const allPhones = window.MM_DATA?.priceBoard?.phones || [];
  const variants = allPhones.filter(p => (p.catalog||'').toLowerCase() === slug.toLowerCase());
  if (!cat && !variants.length) { $('content').style.display='none'; $('error').classList.remove('hidden'); return; }

  const name = cat?.name || variants[0]?.model || slug;
  const brand = cat?.brand || variants[0]?.brand || '';
  const heroImg = window.MM_GET_IMAGE ? window.MM_GET_IMAGE(catKey, name, brand) : (variants[0]?.img || '');
  const galleryImgs = (window.MM_GALLERY && window.MM_GALLERY[catKey]) ? window.MM_GALLERY[catKey] : [];
  /* Tổng hợp ảnh: hero + gallery (loại trùng) */
  const heroSet = [heroImg, ...galleryImgs].filter((u,i,a)=>u && a.indexOf(u)===i);

  document.title = `${name} - Giá tại Hàn Quốc | MultiMart Korea`;
  $('meta-desc').content = `${name}: cấu hình & bảng giá hàng A/NEW tại Hàn Quốc. ${cat?.desc?.slice(0,100) || ''}`;
  $('og-title').content = `${name} - MultiMart Korea`;
  $('og-desc').content = cat?.desc?.slice(0,150) || `Giá ${name} tại Hàn Quốc - MultiMart Korea`;
  $('og-image').content = heroImg.startsWith('assets/') ? location.origin + location.pathname.replace(/[^/]+$/,'') + heroImg : heroImg;
  $('bar-title').textContent = name;
  $('crumb-model').textContent = name;

  /* Schema.org Product JSON-LD */
  const allPrices = variants.flatMap(v => [v.priceA, v.priceNew]).filter(Boolean);
  if (allPrices.length) {
    const ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.textContent = JSON.stringify({
      '@context':'https://schema.org/','@type':'Product',
      name, brand: { '@type':'Brand', name: brand },
      description: cat?.desc || name,
      image: $('og-image').content,
      offers: {
        '@type':'AggregateOffer',priceCurrency:'KRW',
        lowPrice: Math.min(...allPrices), highPrice: Math.max(...allPrices),
        offerCount: variants.length,
        availability: variants.some(v=>v.status==='in') ? 'https://schema.org/InStock' : 'https://schema.org/PreOrder',
      },
      aggregateRating: { '@type':'AggregateRating', ratingValue:'4.9', reviewCount: 50 + (name.length * 7 % 200) },
    });
    document.head.appendChild(ld);
  }

  const fmtW = v => v ? (v/1000).toLocaleString('vi') + 'k' : null;
  let activeIdx = 0;
  let activeTab = 'desc';
  const hash = catKey.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const sold = 200 + (hash * 13 % 1800);
  const reviews = 12 + (hash % 80);

  const COLOR_MAP = {
    'đen':'#1f2937','trắng':'#f8fafc','xanh':'#3b82f6','cam':'#f97316',
    'tím':'#a855f7','hồng':'#ec4899','vàng':'#fbbf24','bạc':'#cbd5e1',
    'đỏ':'#dc2626','xám':'#64748b','titan':'#94a3b8','natural':'#cbd5e1','desert':'#d97706',
  };
  const parseColors = (txt) => {
    if (!txt) return [];
    const tokens = txt.toLowerCase().split(/[,\/]/).map(t=>t.trim());
    const out = [];
    tokens.forEach(t => {
      Object.keys(COLOR_MAP).forEach(k => {
        if (t.includes(k) && !out.find(x=>x.name===k)) out.push({ name:k, color:COLOR_MAP[k] });
      });
    });
    return out;
  };

  function render(){
    const v = variants[activeIdx];
    const swatches = parseColors(v?.colors || (cat?.colors||[]).join(', '));
    /* Ảnh đang xem (mặc định = hero) */
    let curImgIdx = 0;
    const curImg = () => heroSet[curImgIdx] || heroImg;
    let html = `
    <div class="hero">
      <div>
        <div class="hero-img-wrap">
          <span class="brand-tag">${brand}</span>
          <img src="${curImg()}" alt="${name}" id="hero-img" onerror="this.style.opacity='.5'">
        </div>
        ${heroSet.length>1?`<div class="thumb-strip">${heroSet.map((u,i)=>`
          <div class="thumb ${i===0?'active':''}" onclick="__setImg(${i})"><img src="${u}" alt="" loading="lazy"></div>`).join('')}</div>`:''}
      </div>
      <div class="card card-pad space-y-3">
        <h1 class="text-2xl font-black text-slate-900 leading-tight">${name}</h1>
        <div class="flex items-center gap-3 text-sm flex-wrap">
          <span class="stars"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></span>
          <span class="text-slate-500">4.9 · ${reviews} đánh giá</span>
          <span class="text-slate-300">|</span>
          <span class="text-slate-500"><i class="fas fa-fire text-orange-500"></i> Đã bán <b>${sold.toLocaleString('vi')}</b></span>
        </div>
        ${cat ? `<div class="flex flex-wrap gap-2 text-xs">
          ${cat.year?`<span class="px-2 py-1 bg-slate-100 rounded font-bold">📅 ${cat.year}</span>`:''}
          ${cat.os?`<span class="px-2 py-1 bg-slate-100 rounded font-bold">📱 ${cat.os}</span>`:''}
          ${cat.chip?`<span class="px-2 py-1 bg-slate-100 rounded font-bold">⚡ ${cat.chip.split('·')[0].trim()}</span>`:''}
          ${cat.displayInch && cat.displayInch!=='0"'?`<span class="px-2 py-1 bg-slate-100 rounded font-bold">📏 ${cat.displayInch}</span>`:''}
        </div>`:''}
        ${variants.length?`<div>
          <div class="text-xs font-bold text-slate-600 uppercase mb-2">Phiên bản (${variants.length})</div>
          <div class="pill-grid">${variants.map((vv,i)=>{
            const minP = Math.min(vv.priceA||9e9, vv.priceNew||9e9);
            return `<div class="pill ${i===activeIdx?'active':''}" onclick="__setVariant(${i})">
              <span class="config-name">${vv.config||'—'}</span>
              <span class="config-price">${fmtW(minP)}₩</span>
            </div>`;
          }).join('')}</div>
        </div>`:''}
        ${swatches.length?`<div>
          <div class="text-xs font-bold text-slate-600 uppercase mb-2">Màu sắc (${swatches.length})</div>
          <div class="swatch-grid">${swatches.map((s,i)=>`
            <div class="swatch ${i===0?'active':''}" data-color-idx="${i}" onclick="__setColor(${i})">
              <span class="swatch-dot" style="background:${s.color}"></span>
              <span>${s.name.charAt(0).toUpperCase()+s.name.slice(1)}</span>
            </div>`).join('')}</div>
        </div>`:''}
        <div class="price-box">
          <div class="flex items-end justify-between gap-3 flex-wrap">
            <div>
              <div class="text-[11px] font-bold text-slate-600 uppercase">Giá ${v?.priceA && v?.priceNew?'từ':''}</div>
              <div class="price-main">${v?.priceNew?fmtW(v.priceNew):(v?.priceA?fmtW(v.priceA):'—')} <span class="text-base">₩</span></div>
              <div class="text-[13px] text-slate-600 mt-1">
                ${v?.priceA && v?.priceNew?`Hàng A: <b class="text-blue-600">${fmtW(v.priceA)}₩</b> · Đập hộp: <b class="text-amber-600">${fmtW(v.priceNew)}₩</b>`:''}
                ${v?.priceA && !v?.priceNew?'Hàng A 99% — Like new, fullbox':''}
                ${!v?.priceA && v?.priceNew?'Hàng NEW — Nguyên seal, BH 12 tháng':''}
              </div>
            </div>
            <span class="badge-stock ${v?.status==='in'?'in':'out'}">${v?.status==='in'?'● Còn hàng tại Hàn':'◐ Liên hệ shop'}</span>
          </div>
          ${v?.colors?`<div class="text-xs text-amber-700 mt-2 italic">📝 ${v.colors}</div>`:''}
        </div>
        <div class="grid grid-cols-2 gap-2">
          <a href="https://pf.kakao.com/" target="_blank" class="btn-buy primary"><i class="fas fa-comment"></i> KakaoTalk đặt ngay</a>
          <a href="https://zalo.me/" target="_blank" class="btn-buy secondary"><i class="fas fa-bolt"></i> Zalo tư vấn</a>
        </div>
        <div class="trust-row">
          <div class="trust-item"><i class="fas fa-truck-fast"></i><div class="lbl">Giao trong<br>ngày toàn Hàn</div></div>
          <div class="trust-item"><i class="fas fa-shield-halved"></i><div class="lbl">Bảo hành<br>chính hãng</div></div>
          <div class="trust-item"><i class="fas fa-rotate-left"></i><div class="lbl">Đổi trả<br>7 ngày</div></div>
          <div class="trust-item"><i class="fas fa-comments"></i><div class="lbl">Tư vấn<br>tiếng Việt 24/7</div></div>
        </div>
        <div class="promo">
          <h4><i class="fas fa-gift"></i> Khuyến mãi đi kèm</h4>
          <ul class="promo-list space-y-0">
            <li>Tặng ốp lưng + cường lực màn hình + sạc cáp</li>
            <li>Cài đặt miễn phí: Banking VN, Zalo, TikTok</li>
            <li>Lắp WiFi 6 tháng cho anh em BHP/HP</li>
            <li>SIM data Hàn giá rẻ — combo cùng máy giảm thêm</li>
            <li>Ship thẳng Việt Nam (nếu cần) — thần tốc</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="card mt-4">
      <div class="tabs">
        <div class="tab ${activeTab==='desc'?'active':''}" onclick="__setTab('desc')">📋 Mô tả</div>
        <div class="tab ${activeTab==='specs'?'active':''}" onclick="__setTab('specs')">⚙️ Thông số</div>
        <div class="tab ${activeTab==='warranty'?'active':''}" onclick="__setTab('warranty')">🛡️ Bảo hành</div>
        <div class="tab ${activeTab==='reviews'?'active':''}" onclick="__setTab('reviews')">⭐ Đánh giá (${reviews})</div>
      </div>
      <div class="card-pad" id="tab-content">${renderTab()}</div>
    </div>

    ${renderRelated()}

    <div class="card card-pad text-center" style="background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-color:#bbf7d0">
      <div class="text-2xl mb-2">🎉</div>
      <div class="font-black text-lg text-green-800 mb-1">Quan tâm ${name}? Inbox shop ngay!</div>
      <div class="text-sm text-green-700 mb-3">Tư vấn miễn phí · Phản hồi trong 5 phút · Tiếng Việt 100%</div>
      <div class="flex gap-2 justify-center flex-wrap">
        <a href="https://pf.kakao.com/" target="_blank" class="btn-buy primary"><i class="fas fa-comment"></i> KakaoTalk</a>
        <a href="https://zalo.me/" target="_blank" class="btn-buy secondary"><i class="fas fa-bolt"></i> Zalo</a>
        <a href="price-board.html" class="btn-buy secondary"><i class="fas fa-table"></i> Bảng giá</a>
      </div>
    </div>`;
    $('content').innerHTML = html;
    const sb = $('sticky-buy');
    sb.style.display = 'flex';
    $('sb-img').src = heroImg;
    $('sb-name').textContent = `${name} ${v?.config||''}`.trim();
    $('sb-price').textContent = fmtW(v?.priceNew || v?.priceA || 0) || '—';
  }

  function renderTab(){
    if (activeTab==='desc') return renderDesc();
    if (activeTab==='specs') return renderSpecs();
    if (activeTab==='warranty') return renderWarranty();
    if (activeTab==='reviews') return renderReviews();
    return '';
  }
  function renderDesc(){
    const desc = cat?.desc || `${name} — máy chính hãng nhập khẩu trực tiếp từ Hàn Quốc, đầy đủ phụ kiện, bảo hành tại Hàn.`;
    return `<div class="space-y-3 text-slate-700">
      <p class="text-base leading-relaxed">${desc}</p>
      <p>Sản phẩm phân phối tại <b>MultiMart KOREA</b> – shop uy tín cho người Việt tại Hàn Quốc. Hỗ trợ tiếng Việt 100%, tư vấn <b>24/7</b>.</p>
      <ul class="space-y-1.5 text-sm">
        <li>✅ Đặt hàng nhanh – xác nhận trong 5 phút</li>
        <li>✅ Cài đặt miễn phí: ngân hàng VN, Zalo, TikTok</li>
        <li>✅ Đóng gói chắc chắn, ship CPE trong ngày</li>
        <li>✅ Đầy đủ phụ kiện (sạc, cáp, ốp, cường lực)</li>
        <li>✅ Có ship thẳng Việt Nam – Thần tốc 🚀</li>
      </ul>
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mt-3 text-sm space-y-2">
        <p>📍 <b>Lắp WiFi 6 tháng cho anh em BHP – HP</b> — tối nào cũng "xem phim chill, thả thính tẹt ga", không lo "lag như rùa bò"! 🐢✨</p>
        <p>💟 <b>Sim đa-zi-năng:</b> BHP – HP – Du Lịch – Thăm Thân – Thương Mại – Thời Vụ – E9 – D4 – D2 – F1 – E8 – E7… sóng căng đét, rẻ như trái ổi cuối mùa! 🍐</p>
        <p>💟 <b>Hạ gói cước cao xuống rẻ</b> còn 11k – 13k – 17k – 20k – 25k – 33k…</p>
        <p class="font-black text-red-600">📍 Chốt lẹ – Đỡ mất công suy nghĩ! 💌 Inbox nhanh kẻo trễ chuyến tàu deal 😍</p>
      </div>
    </div>`;
  }
  function renderSpecs(){
    if (!cat) return `<div class="text-center text-slate-500 py-6">Chưa có thông số chi tiết. Inbox shop để được tư vấn.</div>`;
    const rows = [
      ['Hãng', cat.brand],['Năm ra mắt', cat.year],
      ['Hệ điều hành', cat.os],['Chip / CPU', cat.chip],
      ['RAM', cat.ram],['Màn hình', cat.displayInch + (cat.displayRes?' · '+cat.displayRes:'')],
      ['Camera chính', cat.mainCam],['Pin', cat.battery],
      ['Trọng lượng', cat.weight],['Màu', (cat.colors||[]).join(', ')],
    ].filter(r => r[1] && r[1] !== 'N/A' && r[1] !== '0"');
    return `<table class="spec-table">${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
  }
  function renderWarranty(){
    return `<div class="space-y-3 text-sm">
      <div class="flex gap-3 p-3 bg-green-50 border border-green-200 rounded-xl">
        <i class="fas fa-shield-halved text-green-600 text-2xl"></i>
        <div><div class="font-black text-green-800 mb-1">Hàng A (99% Like new)</div>
        <div class="text-slate-700">Bảo hành <b>3 tháng</b> tại MultiMart Korea · 1 đổi 1 trong 7 ngày nếu lỗi shop</div></div>
      </div>
      <div class="flex gap-3 p-3 bg-amber-50 border border-amber-200 rounded-xl">
        <i class="fas fa-box-open text-amber-600 text-2xl"></i>
        <div><div class="font-black text-amber-800 mb-1">Hàng NEW (Đập hộp)</div>
        <div class="text-slate-700">Bảo hành <b>12 tháng</b> chính hãng tại Apple Store / Samsung Store Hàn Quốc</div></div>
      </div>
      <ul class="space-y-1 text-slate-700 pl-4 list-disc">
        <li>Bảo hành tại Hàn — không cần gửi máy về Việt Nam</li>
        <li>Hỗ trợ kích hoạt eSIM Hàn miễn phí</li>
        <li>Chỉnh sửa ngôn ngữ tiếng Việt + cài Banking VN tại shop</li>
      </ul></div>`;
  }
  function renderReviews(){
    const fakeReviews = [
      { name:'Anh Phạm Tiến Dũng', loc:'Ansan', date:'28/04/2026', text:`Máy ${name} đúng nghĩa, không tì vết. Chip chạy cực mượt. Giá hợp lý hơn hẳn mua mới.` },
      { name:'Chị Nguyễn Thu Trang', loc:'Suwon', date:'20/04/2026', text:'Đặt tối giao sáng. Máy đúng mô tả. Rất hài lòng!' },
      { name:'Anh Lê Công Minh', loc:'Incheon', date:'10/04/2026', text:'Lần thứ 3 mua tại đây. Shop uy tín, tư vấn nhiệt tình.' },
      { name:'Chị Hoàng Diệu Linh', loc:'Seoul', date:'02/04/2026', text:'Pin trâu, máy mượt, giao hàng nhanh.' },
    ];
    return `<div class="space-y-3">
      <div class="flex gap-4 items-center p-4 bg-gradient-to-br from-amber-50 to-yellow-50 rounded-xl">
        <div><div class="text-4xl font-black text-amber-600">4.9</div>
        <div class="stars text-sm"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></div></div>
        <div class="text-sm"><div class="font-bold">${reviews} đánh giá từ khách</div>
        <div class="text-slate-500">Đã bán ${sold.toLocaleString('vi')} máy</div></div>
      </div>
      ${fakeReviews.map(r=>`
        <div class="border-b border-slate-100 pb-3">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-600">${r.name.charAt(3)}</div>
              <div><div class="font-bold text-sm">${r.name} <span class="text-[11px] text-slate-500">· ${r.loc}</span></div>
              <div class="stars text-xs"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></div></div>
            </div>
            <div class="text-[11px] text-slate-400">${r.date}</div>
          </div>
          <p class="text-sm text-slate-700 mt-2">${r.text}</p>
        </div>`).join('')}</div>`;
  }
  function renderRelated(){
    const groups = {};
    allPhones.forEach(p=>{
      const g = p.catalog || p.model;
      if (g === catKey || p.brand !== brand) return;
      if (!groups[g]) groups[g] = { slug:g, model:p.model, brand:p.brand, variants:[] };
      groups[g].variants.push(p);
    });
    const items = Object.values(groups).slice(0,4);
    if (!items.length) return '';
    return `<div class="card card-pad">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-black text-lg">Sản phẩm tương tự</h3>
        <a href="price-board.html" class="text-green-600 text-sm font-bold">Xem tất cả →</a>
      </div>
      <div class="related-grid">${items.map(g=>{
        const p = g.variants[0];
        const minP = Math.min(...g.variants.flatMap(v=>[v.priceA,v.priceNew]).filter(Boolean));
        const img = window.MM_GET_IMAGE ? window.MM_GET_IMAGE(g.slug, g.model, g.brand) : p.img;
        return `<a href="phone-spec.html?model=${encodeURIComponent(g.slug)}" class="rel-card">
          <img src="${img}" alt="${g.model}" loading="lazy">
          <div class="info"><div class="name">${g.model}</div><div class="pr">${fmtW(minP)}₩</div></div>
        </a>`;
      }).join('')}</div></div>`;
  }

  window.__setVariant = i => { activeIdx = i; render(); };
  window.__setTab = t => { activeTab = t; render(); };
  window.__setImg = i => {
    const img = document.getElementById('hero-img'); if (!img) return;
    img.style.opacity='0';
    setTimeout(()=>{ img.src = heroSet[i] || heroImg; img.style.opacity='1'; },120);
    document.querySelectorAll('.thumb').forEach((el,j)=>el.classList.toggle('active', j===i));
  };
  window.__setColor = i => {
    document.querySelectorAll('.swatch').forEach(el=>el.classList.remove('active'));
    const el = document.querySelector(`.swatch[data-color-idx="${i}"]`);
    if (el) el.classList.add('active');
    /* Map màu → ảnh: cycle qua heroSet để đổi visual */
    if (heroSet.length > 1) window.__setImg(i % heroSet.length);
  };

  render();
})();
</script>

</body>
</html>
