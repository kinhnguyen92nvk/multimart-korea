<!DOCTYPE html>
<html lang="vi" data-mm-page="cart">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gi? hàng - MultiMart KOREA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/seo.js"></script>
</head>
<body class="pb-32 md:pb-10">
<div data-mm="header"></div>

<main class="max-w-7xl mx-auto px-4 pt-6">
  <h1 class="text-3xl font-black mb-6">?? Gi? hàng c?a b?n</h1>

  <div id="empty" class="hidden text-center py-20">
    <div class="text-7xl mb-4">??</div>
    <h3 class="text-xl font-bold text-slate-700">Gi? hàng dang tr?ng</h3>
    <p class="text-sm text-slate-500 mt-2">Thêm s?n ph?m d? b?t d?u mua s?m thôi nào!</p>
    <a href="index.html" class="btn btn-primary mt-6 no-underline">Khám phá s?n ph?m</a>
  </div>

  <div id="content" class="grid md:grid-cols-3 gap-6">
    <!-- Items -->
    <div class="md:col-span-2 space-y-3" id="items"></div>

    <!-- Summary -->
    <aside class="md:col-span-1">
      <div class="card !p-6 sticky top-32">
        <h3 class="font-black text-lg mb-4">Tóm t?t don hàng</h3>
        <div class="space-y-3 text-sm pb-4 border-b border-slate-100">
          <div class="flex justify-between"><span class="text-slate-500">T?m tính</span><span id="subtotal" class="font-bold krw">0</span></div>
          <div class="flex justify-between"><span class="text-slate-500">Phí ship Hàn</span><span class="font-bold text-green-600">Mi?n phí</span></div>
          <div class="flex justify-between"><span class="text-slate-500">Mã gi?m giá</span><span class="font-bold text-indigo-600 cursor-pointer">+ Áp mã</span></div>
        </div>
        <div class="flex justify-between items-baseline pt-4">
          <span class="font-bold">T?ng</span>
          <span id="total" class="text-2xl font-black gradient-text krw">0</span>
        </div>
        <p id="vnd" class="text-xs text-slate-400 text-right mt-1"></p>
        <a href="checkout.html" class="btn btn-primary w-full mt-6 no-underline">Ti?n hành thanh toán <i class="fas fa-arrow-right"></i></a>
        <button onclick="MM_STATE.clearCart(); location.reload()" class="btn btn-ghost w-full mt-2 text-xs">Xóa toàn b? gi?</button>
      </div>
    </aside>
  </div>
</main>

<div data-mm="footer"></div>
<div data-mm="bottomnav" data-active="cat"></div>

<script src="assets/data/phones-images.js"></script><script src="assets/data/products.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const { formatKRW, toVND, cartTotal, renderList } = window.MM_UTILS;
  const render = () => {
    const cart = MM_STATE.getCart();
    document.getElementById('empty').classList.toggle('hidden', cart.length>0);
    document.getElementById('content').classList.toggle('hidden', cart.length===0);
    document.getElementById('items').innerHTML = renderList(cart, it => `
      <div class="card !p-3 flex gap-3 items-center">
        <img src="${it.img}" class="w-20 h-20 rounded-2xl object-cover">
        <div class="flex-1">
          <a href="product.html?id=${it.id}" class="font-bold text-slate-800 text-sm no-underline hover:text-indigo-600">${it.name}</a>
          <div class="text-red-500 font-black mt-1 krw">${formatKRW(it.price)}</div>
        </div>
        <div class="flex flex-col items-end gap-2">
          <button onclick="MM_STATE.removeFromCart('${it.id}'); location.reload()" class="text-slate-400 hover:text-red-500"><i class="fas fa-trash text-xs"></i></button>
          <div class="flex items-center bg-slate-100 rounded-xl">
            <button onclick="MM_STATE.updateQty('${it.id}', ${it.qty-1}); location.reload()" class="w-8 h-8 font-bold">-</button>
            <span class="w-8 text-center text-sm font-bold">${it.qty}</span>
            <button onclick="MM_STATE.updateQty('${it.id}', ${it.qty+1}); location.reload()" class="w-8 h-8 font-bold">+</button>
          </div>
        </div>
      </div>
    `);
    const total = cartTotal(cart);
    document.getElementById('subtotal').textContent = formatKRW(total);
    document.getElementById('total').textContent = formatKRW(total);
    document.getElementById('vnd').textContent = '~ ' + toVND(total) + ' ?';
  };
  render();
});
</script>
<script src="assets/js/enhancements.js"></script>
</body>
</html>
